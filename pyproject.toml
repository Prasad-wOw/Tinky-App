[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tinky"
version = "1.0.0"
description = "AI-powered inline text enhancement for Windows desktops"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "tinky Team", email = "tinky@example.com" }
]
requires-python = ">=3.11"
keywords = ["ai", "text", "keyboard", "productivity", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.7.0",
    "keyboard>=0.13.5",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "qasync>=0.27.1",
    "cryptography>=42.0.0",
    "tomli-w>=1.0.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
tinky = "tinky.__main__:main"

[project.urls]
Homepage = "https://github.com/tinky/tinky"
Repository = "https://github.com/tinky/tinky"
"Bug Tracker" = "https://github.com/tinky/tinky/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinky*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tinky/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
